name: Feature request
description: Propose an enhancement to Mima.AI.Prompt
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This package is **prompt composition** (messages, templates, validation, JSON adapters).
        It does **not** call models or run tools. Feature requests for HTTP clients, native `tools` arrays, or agent loops belong in the **host app** (or a future separate package), not as “this NuGet should become Semantic Kernel.”
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for prompt authors?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behavior
      description: Sketches welcome (namespaces must stay under Mima.AI.Prompt).
      render: csharp
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
