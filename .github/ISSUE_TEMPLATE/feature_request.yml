name: Feature request
description: Propose an enhancement to Mima.AI.Prompt
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This package is **prompt composition**: messages, templates, validation, and canonical JSON.
        Feature requests should stay in that surface (builder, parts, serializer, validator, conversation, versioning).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve for prompt authors?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API / behavior
      description: Sketches welcome. Namespaces stay `Mima.AI.Prompt`.
      render: csharp
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
