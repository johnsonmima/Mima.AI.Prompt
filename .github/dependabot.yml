# Dependabot — keep GitHub Actions and NuGet packages current
# Why: open-source libraries rot when transitive CVEs go unnoticed.
# Version-update PRs: every 6 months (1 Jan and 1 Jul UTC). Security alerts
# take those on a human PR when you want the breaking upgrade.

version: 2
updates:
  # Stage: NuGet dependencies in the library and test projects
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: semiannually
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: nuget
    directory: "/tests/Mima.AI.Prompt.Tests"
    schedule:
      interval: semiannually
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Stage: GitHub Actions action versions (checkout, setup-dotnet, …)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: semiannually
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
