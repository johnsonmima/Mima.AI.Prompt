# Continuous Integration — Mima.AI.Prompt
#
# Why: open-source consumers and contributors need an automated, transparent
# gate that proves every PR builds on all target frameworks, passes tests,
# and packs a valid NuGet package before merge.
#
# Triggers: push to main / release branches, and all pull requests.

name: CI

on:
  # Stage: run on pushes to protected / release branches
  push:
    branches: [main, master, 'v*']
  # Stage: run on every pull request targeting those branches
  pull_request:
    branches: [main, master, 'v*']

# Cancel in-progress runs for the same PR/branch to save Actions minutes
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Treat CI as ContinuousIntegrationBuild for SourceLink / deterministic builds
  CI: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage: BUILD
  # Restores dependencies and compiles the multi-targeted library
  # (netstandard2.0, net6.0, net8.0, net10.0) plus the test project.
  # ---------------------------------------------------------------------------
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # Stage step: fetch full history so SourceLink / versioning can resolve commits
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Stage step: install the .NET SDK that can build net10.0 and older TFMs
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            packages.lock.json
            tests/Mima.AI.Prompt.Tests/packages.lock.json

      # Stage step: restore NuGet packages (PolySharp, System.Text.Json, test deps)
      - name: Restore dependencies
        run: dotnet restore Mima.AI.Prompt.sln --locked-mode

      # Stage step: compile Release configuration for all target frameworks
      - name: Build solution
        run: dotnet build Mima.AI.Prompt.sln -c Release --no-restore

  # ---------------------------------------------------------------------------
  # Stage: TEST
  # Runs the full xUnit suite with Coverlet and fails if line coverage
  # drops below the required threshold (open-source quality bar).
  # ---------------------------------------------------------------------------
  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: |
            packages.lock.json
            tests/Mima.AI.Prompt.Tests/packages.lock.json

      - name: Restore dependencies
        run: dotnet restore Mima.AI.Prompt.sln --locked-mode

      # Stage step: execute unit tests and collect Cobertura coverage
      - name: Run unit tests with coverage
        run: >
          dotnet test tests/Mima.AI.Prompt.Tests/Mima.AI.Prompt.Tests.csproj
          -c Release
          --no-restore
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=./coverage/
          /p:Include=[Mima.AI.Prompt]*
          /p:Threshold=95
          /p:ThresholdType=line
          /p:ThresholdStat=total

      # Stage step: upload coverage artifact for PR reviewers / badges
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: tests/Mima.AI.Prompt.Tests/coverage/
          if-no-files-found: ignore
          retention-days: 14

      # Stage step: markdown table for the Actions summary and the pull request
      - name: Render coverage report
        if: always()
        id: coverage_md
        shell: python
        run: |
          import os
          from collections import defaultdict
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("tests/Mima.AI.Prompt.Tests/coverage/coverage.cobertura.xml")
          out = Path("coverage-report.md")
          marker = "<!-- mima-ai-prompt-coverage -->"

          def pct(rate: str) -> float:
              return float(rate or "0") * 100

          if not report.is_file():
              body = f"{marker}\n## Coverage\n\nCobertura report was not produced.\n"
              out.write_text(body, encoding="utf-8")
              summary = os.environ.get("GITHUB_STEP_SUMMARY")
              if summary:
                  with open(summary, "a", encoding="utf-8") as fh:
                      fh.write(body)
              raise SystemExit(0)

          root = ET.parse(report).getroot()
          line_pct = pct(root.attrib.get("line-rate"))
          branch_pct = pct(root.attrib.get("branch-rate"))
          lines_covered = root.attrib.get("lines-covered", "?")
          lines_valid = root.attrib.get("lines-valid", "?")

          files = defaultdict(lambda: {"line": 0.0, "branch": 0.0, "n": 0})
          for cls in root.findall(".//class"):
              name = cls.attrib.get("filename") or cls.attrib.get("name") or "?"
              files[name]["line"] += pct(cls.attrib.get("line-rate"))
              files[name]["branch"] += pct(cls.attrib.get("branch-rate"))
              files[name]["n"] += 1

          rows = []
          for name, stats in files.items():
              n = stats["n"] or 1
              rows.append((stats["line"] / n, name, stats["branch"] / n))
          rows.sort(key=lambda r: (r[0], r[1]))

          gate = 95.0
          status = "pass" if line_pct >= gate else "fail"
          lines = [
              marker,
              "## Coverage — Mima.AI.Prompt",
              "",
              f"| Metric | Value | Gate |",
              f"| --- | --- | --- |",
              f"| Line | **{line_pct:.2f}%** ({lines_covered}/{lines_valid}) | ≥ {gate:.0f}% (**{status}**) |",
              f"| Branch | {branch_pct:.2f}% | (informational) |",
              "",
              "<details>",
              "<summary>Per-file line coverage (lowest first)</summary>",
              "",
              "| File | Line | Branch |",
              "| --- | ---: | ---: |",
          ]
          for line_p, name, branch_p in rows:
              flag = " " if line_p >= gate else " ⚠️"
              lines.append(f"| `{name}` | {line_p:.1f}%{flag} | {branch_p:.1f}% |")
          lines.extend(["", "</details>", ""])
          body = "\n".join(lines)
          out.write_text(body, encoding="utf-8")
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write(body)

      - name: Comment coverage on pull request
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY_FILE=coverage-report.md
          test -f "$BODY_FILE" || exit 0
          COMMENT_ID=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            --jq '.[] | select(.body | contains("<!-- mima-ai-prompt-coverage -->")) | .id' | head -n 1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/${COMMENT_ID}" \
              -F body=@"$BODY_FILE"
          else
            gh api --method POST "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
              -F body=@"$BODY_FILE"
          fi

  # ---------------------------------------------------------------------------
  # Stage: PACK
  # Produces the NuGet package (.nupkg + .snupkg) to prove packing works.
  # Publishing to nuget.org happens only in the separate release workflow.
  # ---------------------------------------------------------------------------
  pack:
    name: Pack
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          cache: true
          cache-dependency-path: packages.lock.json

      - name: Restore dependencies
        run: dotnet restore Mima.AI.Prompt.csproj --locked-mode

      # Stage step: create the package that would be published
      - name: Pack NuGet package
        run: >
          dotnet pack Mima.AI.Prompt.csproj
          -c Release
          --no-restore
          -o ./artifacts
          /p:ContinuousIntegrationBuild=true

      # Stage step: retain artifacts for manual inspection / release promotion
      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ./artifacts/*.nupkg
          retention-days: 14
